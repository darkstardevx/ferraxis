name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    name: Code gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Repository validation
        run: cargo run -p xtask -- validate

  msrv:
    name: MSRV 1.85.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Check all features
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Test all features
        run: cargo test --workspace --all-features --locked

      - name: Check no default features
        run: cargo check --workspace --all-targets --no-default-features --locked

  docs:
    name: Documentation gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

      - name: Project documentation structure
        run: cargo run -p xtask -- validate-docs

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml "**/*.md"
          fail: true
