name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ferraxis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code:
    name: Stable code gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features --locked

      - name: Repository validation
        run: cargo run -p xtask --locked -- validate

  features:
    name: Feature isolation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: No default features
        run: cargo check --workspace --all-targets --no-default-features --locked

      - name: No default feature tests
        run: cargo test --workspace --no-default-features --locked

  msrv:
    name: MSRV 1.85.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Check all features
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Test all features
        run: cargo test --workspace --all-features --locked

      - name: Check no default features
        run: cargo check --workspace --all-targets --no-default-features --locked

  workflow:
    name: Repository workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shell policy
        env:
          FERRAXIS_REQUIRE_SHELLCHECK: "1"
        run: ./scripts/check-shell.sh

      - name: Text policy
        run: ./scripts/check-text-files

      - name: Workflow records
        run: cargo run -p xtask --locked -- validate-docs

  docs:
    name: Documentation gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

      - name: Project documentation structure
        run: cargo run -p xtask --locked -- validate-docs

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml "**/*.md"
          fail: true
